# Mailer Worker (separate from the Pages site): contact-form notifications + daily digest.
# Deploy from this folder:  npx wrangler deploy
# Set the recipient once:   npx wrangler secret put NOTIFY_TO
name = "angel-harris-mailer"
main = "index.js"
compatibility_date = "2026-03-01"
workers_dev = false      # no public URL; reachable only through the Pages service binding
preview_urls = false

[vars]
NOTIFY_FROM = "contact@angelharrisportfolio.com"

[[send_email]]
name = "EMAIL"

# Read-only use: builds the daily digest. (A database id is an identifier, not a credential.)
[[d1_databases]]
binding = "DB"
database_name = "angel-harris-db"
database_id = "5b3e7f71-e365-4e3d-bff1-cf16f13e3216"

[triggers]
crons = ["0 13 * * *"]   # 13:00 UTC daily (8am US Eastern / Panama). Empty days send nothing.
