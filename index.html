<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Angel Harris | Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Serif:ital@1&display=swap">
  <style>
    :root {
      --bg: #fff1dc;
      --text: #1b1209;
      --muted: #6d5b46;
      --ink: #1b1209;
      --c1: #ff4d2e;
      --c2: #ff6fb5;
      --c3: #c8f23d;
      --c4: #7a5cff;
      --c5: #2fc4f5;
      --font-ui: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-accent: "Instrument Serif", Georgia, "Times New Roman", serif;
      --star12: polygon(50.0% 0.0%, 60.4% 11.4%, 75.0% 6.7%, 78.3% 21.7%, 93.3% 25.0%, 88.6% 39.6%, 100.0% 50.0%, 88.6% 60.4%, 93.3% 75.0%, 78.3% 78.3%, 75.0% 93.3%, 60.4% 88.6%, 50.0% 100.0%, 39.6% 88.6%, 25.0% 93.3%, 21.7% 78.3%, 6.7% 75.0%, 11.4% 60.4%, 0.0% 50.0%, 11.4% 39.6%, 6.7% 25.0%, 21.7% 21.7%, 25.0% 6.7%, 39.6% 11.4%);
      --star8: polygon(50.0% 0.0%, 61.5% 22.3%, 85.4% 14.6%, 77.7% 38.5%, 100.0% 50.0%, 77.7% 61.5%, 85.4% 85.4%, 61.5% 77.7%, 50.0% 100.0%, 38.5% 77.7%, 14.6% 85.4%, 22.3% 61.5%, 0.0% 50.0%, 22.3% 38.5%, 14.6% 14.6%, 38.5% 22.3%);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #150a24;
        --text: #fff1dc;
        --muted: #bba8d4;
        color-scheme: dark;
      }
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background: var(--bg);
      color: var(--text);
      font: 400 1rem/1.6 var(--font-ui);
      overflow-x: hidden;
    }

    /* Animated colour-blob backdrop (CSS only) */
    .fx { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; background: var(--bg); }
    .fx i { position: absolute; display: block; border-radius: 50%; will-change: transform; }
    .b1 { width: 62vmax; height: 62vmax; left: -18vmax; top: -22vmax; background: radial-gradient(circle, var(--c1) 0, transparent 64%); opacity: .5; animation: drift1 26s ease-in-out infinite alternate; }
    .b2 { width: 55vmax; height: 55vmax; right: -20vmax; top: 6vmax; background: radial-gradient(circle, var(--c4) 0, transparent 64%); opacity: .4; animation: drift2 31s ease-in-out infinite alternate; }
    .b3 { width: 58vmax; height: 58vmax; left: 12vmax; bottom: -30vmax; background: radial-gradient(circle, var(--c2) 0, transparent 64%); opacity: .45; animation: drift3 28s ease-in-out infinite alternate; }
    .b4 { width: 40vmax; height: 40vmax; right: 8vmax; bottom: -12vmax; background: radial-gradient(circle, var(--c3) 0, transparent 64%); opacity: .5; animation: drift4 22s ease-in-out infinite alternate; }
    .fx::after {
      content: ""; position: absolute; inset: 0; opacity: .16; mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='160' height='160'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.6'/%3E%3C/svg%3E");
    }
    @media (prefers-color-scheme: dark) {
      .fx::after { mix-blend-mode: screen; opacity: .08; }
      .b1, .b2, .b3, .b4 { opacity: .38; }
    }
    @keyframes drift1 { to { transform: translate(38vmax, 22vmax) scale(1.25) rotate(40deg); } }
    @keyframes drift2 { to { transform: translate(-34vmax, 20vmax) scale(.85); } }
    @keyframes drift3 { to { transform: translate(30vmax, -26vmax) scale(1.2); } }
    @keyframes drift4 { to { transform: translate(-28vmax, -18vmax) scale(1.3); } }
    @keyframes spin { to { rotate: 360deg; } }
    @keyframes float { 50% { translate: 0 -18px; } }
    @keyframes bob { 50% { translate: 0 -.06em; } }
    @keyframes morph {
      0%   { border-radius: 62% 38% 46% 54% / 56% 42% 58% 44%; }
      50%  { border-radius: 38% 62% 60% 40% / 42% 60% 40% 58%; }
      100% { border-radius: 54% 46% 36% 64% / 60% 36% 64% 40%; }
    }

    /* Floating shapes */
    .shape { position: fixed; z-index: -1; pointer-events: none; }
    .ring { width: clamp(70px, 11vw, 150px); aspect-ratio: 1; border: 14px solid var(--c4); border-radius: 50%; right: 7%; top: 12%; animation: float 9s ease-in-out infinite; }
    .blob { width: clamp(60px, 9vw, 120px); aspect-ratio: 1; background: var(--c2); left: 8%; bottom: 12%; animation: morph 9s ease-in-out infinite alternate, float 12s ease-in-out infinite; }
    .star { width: clamp(44px, 6vw, 80px); aspect-ratio: 1; background: var(--c5); clip-path: var(--star8); right: 14%; bottom: 8%; animation: spin 18s linear infinite; }

    main { position: relative; width: 100%; max-width: 46rem; text-align: center; }
    .badge {
      display: inline-flex; align-items: center; gap: 8px; margin: 0 0 24px; padding: 6px 14px;
      border: 2px solid var(--text); border-radius: 999px; font-weight: 600; font-size: .875rem;
      background: color-mix(in srgb, var(--bg) 70%, transparent);
    }
    .badge::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--c1); animation: float 2s ease-in-out infinite; }

    h1 {
      margin: 0 0 20px;
      font-weight: 800;
      font-size: clamp(2.5rem, 11vw, 6rem);
      line-height: .98;
      letter-spacing: -0.045em;
      overflow-wrap: break-word;
    }
    h1 .w { display: inline-block; margin-right: .14em; animation: bob 5s ease-in-out infinite; }
    h1 .w:nth-child(2) { animation-delay: -.8s; }
    h1 .w:nth-child(3) { animation-delay: -1.6s; }
    h1 .w:nth-child(4) { animation-delay: -2.4s; }
    h1 .w:nth-child(5) { animation-delay: -3.2s; }
    h1 .w:nth-child(6) { animation-delay: -4s; }
    h1 .w:nth-child(7) { animation-delay: -4.8s; }
    h1 .w:nth-child(8) { animation-delay: -5.6s; }
    h1 .it { font-family: var(--font-accent); font-style: italic; font-weight: 400; letter-spacing: -0.02em; color: var(--c1); }
    h1 .hl { background: var(--c3); color: var(--ink); padding: 0 .14em; border-radius: .22em; rotate: -2deg; }

    .es { margin: 0 0 36px; color: var(--muted); font-size: clamp(1.125rem, 3.4vw, 1.5rem); font-family: var(--font-accent); font-style: italic; }

    .sticker {
      position: absolute; top: -64px; right: 24px; width: 96px; height: 96px; display: grid; place-items: center;
      background: var(--c3); color: var(--ink); clip-path: var(--star12); animation: spin 16s linear infinite;
      font-weight: 800; font-size: .75rem; line-height: 1.05; text-transform: uppercase; text-align: center;
    }

    .contact { margin: 0; font-size: 1rem; font-weight: 600; }
    .contact a {
      display: inline-block; margin-top: 8px; padding: 12px 26px; border: 2px solid var(--text); border-radius: 999px;
      background: var(--c1); color: var(--ink); text-decoration: none; box-shadow: 5px 5px 0 var(--text);
      transition: translate .15s, box-shadow .15s;
    }
    .contact a:hover { translate: -3px -3px; box-shadow: 8px 8px 0 var(--text); }
    a:focus-visible { outline: 3px solid var(--c4); outline-offset: 4px; }

    @media (max-width: 520px) { .sticker { width: 78px; height: 78px; top: -58px; font-size: .625rem; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <div class="fx" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i></div>
  <span class="shape ring" aria-hidden="true"></span>
  <span class="shape blob" aria-hidden="true"></span>
  <span class="shape star" aria-hidden="true"></span>

  <main>
    <span class="sticker" aria-hidden="true">Back<br>soon</span>
    <p class="badge">Angel Harris</p>
    <h1>
      <span class="w">We're</span>
      <span class="w it">under</span>
      <span class="w hl">maintenance</span>
      <span class="w">and</span>
      <span class="w">will</span>
      <span class="w">be</span>
      <span class="w it">back</span>
      <span class="w">soon.</span>
    </h1>
    <p class="es" lang="es">Estamos en mantenimiento y volveremos pronto.</p>
    <p class="contact">Get in touch<br><a href="mailto:[EMAIL]">[EMAIL]</a></p>
  </main>
</body>
</html>
