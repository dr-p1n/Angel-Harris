<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Angel Harris | Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..500,0..100,0..1;1,9..144,300..500,0..100,0..1&family=Bricolage+Grotesque:opsz,wght@12..96,400..600&display=swap">
  <style>
    :root {
      --bg: #f6f1e9;
      --text: #231d17;
      --muted: #7a6f62;
      --accent: #b4532a;
      --rule: #ddd3c4;
      --glow1: #f1c9a6;
      --glow2: #cfd9c6;
      --glow3: #d8cde6;
      --font-display: "Fraunces", Georgia, "Times New Roman", serif;
      --font-ui: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #171310;
        --text: #f1ebe2;
        --muted: #a39887;
        --accent: #e08a5f;
        --rule: #342d26;
        --glow1: #6b3f29;
        --glow2: #2f4034;
        --glow3: #3c3157;
        color-scheme: dark;
      }
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background: var(--bg);
      color: var(--text);
      font: 400 1rem/1.6 var(--font-ui);
      overflow-x: hidden;
    }

    /* Slow, soft colour wash behind the message (CSS only) */
    .wash { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; background: var(--bg); }
    .wash i { position: absolute; display: block; border-radius: 50%; will-change: transform; opacity: .55; }
    .g1 { width: 70vmax; height: 70vmax; left: -25vmax; top: -30vmax; background: radial-gradient(circle, var(--glow1) 0, transparent 66%); animation: drift1 48s ease-in-out infinite alternate; }
    .g2 { width: 64vmax; height: 64vmax; right: -28vmax; top: 4vmax; background: radial-gradient(circle, var(--glow3) 0, transparent 66%); animation: drift2 56s ease-in-out infinite alternate; }
    .g3 { width: 66vmax; height: 66vmax; left: 6vmax; bottom: -38vmax; background: radial-gradient(circle, var(--glow2) 0, transparent 66%); animation: drift3 52s ease-in-out infinite alternate; }
    @keyframes drift1 { to { transform: translate(26vmax, 16vmax) scale(1.15); } }
    @keyframes drift2 { to { transform: translate(-22vmax, 18vmax) scale(.9); } }
    @keyframes drift3 { to { transform: translate(22vmax, -16vmax) scale(1.12); } }

    main { width: 100%; max-width: 40rem; text-align: center; }

    .name {
      margin: 0 0 28px;
      font-size: .8125rem;
      font-weight: 500;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--muted);
    }

    h1 {
      margin: 0 0 20px;
      font-family: var(--font-display);
      font-weight: 400;
      font-variation-settings: "SOFT" 100, "WONK" 1;
      font-size: clamp(2.25rem, 7.5vw, 4.5rem);
      line-height: 1.08;
      letter-spacing: -0.02em;
      overflow-wrap: break-word;
    }
    h1 em { font-style: italic; color: var(--accent); }

    .es {
      margin: 0 0 40px;
      color: var(--muted);
      font-family: var(--font-display);
      font-style: italic;
      font-weight: 300;
      font-size: clamp(1.0625rem, 3vw, 1.375rem);
    }

    hr { width: 3rem; margin: 0 auto 24px; border: 0; border-top: 1px solid var(--rule); }

    .contact { margin: 0; font-size: .9375rem; color: var(--muted); }
    .contact a { color: var(--accent); text-underline-offset: 4px; text-decoration-thickness: 1px; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

    @media (prefers-reduced-motion: reduce) { .wash i { animation: none; } }
  </style>
</head>
<body>
  <div class="wash" aria-hidden="true"><i class="g1"></i><i class="g2"></i><i class="g3"></i></div>

  <main>
    <p class="name">Angel Harris</p>
    <h1>We're under <em>maintenance</em> and will be back soon.</h1>
    <p class="es" lang="es">Estamos en mantenimiento y volveremos pronto.</p>
    <hr>
    <p class="contact">Get in touch: <a href="mailto:[EMAIL]">[EMAIL]</a></p>
  </main>
</body>
</html>
