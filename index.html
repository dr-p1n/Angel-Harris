<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Angel Harris | Portfolio</title>
  <style>
    :root {
      --bg: #faf7f2;
      --text: #1f1b16;
      --muted: #6b645b;
      --accent: #b4532a;
      --rule: #e4ddd2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14110f;
        --text: #f1ebe2;
        --muted: #a79f94;
        --accent: #e08a5f;
        --rule: #2b2622;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
    }
    main {
      width: 100%;
      max-width: 36rem;
      text-align: center;
    }
    .name {
      margin: 0 0 24px;
      font-size: 0.8125rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.75rem, 6vw, 2.5rem);
      line-height: 1.2;
      font-weight: 600;
      overflow-wrap: break-word;
    }
    .es {
      margin: 0 0 32px;
      color: var(--muted);
      font-size: 1.0625rem;
      font-style: italic;
    }
    hr {
      width: 3rem;
      margin: 0 auto 24px;
      border: 0;
      border-top: 1px solid var(--rule);
    }
    .contact { margin: 0; font-size: 0.9375rem; color: var(--muted); }
    a { color: var(--accent); text-underline-offset: 3px; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="name">Angel Harris</p>
    <h1>We're under maintenance and will be back soon.</h1>
    <p class="es" lang="es">Estamos en mantenimiento y volveremos pronto.</p>
    <hr>
    <p class="contact">Get in touch: <a href="mailto:[EMAIL]">[EMAIL]</a></p>
  </main>
</body>
</html>
